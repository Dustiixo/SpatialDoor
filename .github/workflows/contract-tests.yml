name: SpatialDoor read-only contract tests

on:
  pull_request:
  push:
    branches:
      - 'review/spatialdoor-identity-2026-11-20'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -q
